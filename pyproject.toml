[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesa-core"
version = "1.2.0"
description = "Reference implementation of the MESA specification: a semantic safety and coordination layer for AI-operated smart environments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Steven Fox", email = "sfox38@gmail.com" }]
keywords = [
    "home-assistant",
    "home-automation",
    "smart-home",
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "ai-safety",
    "guardrails",
    "authorization",
    "access-control",
    "llm",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Typing :: Typed",
]
# Zero runtime dependencies by design: all HA data arrives via host callbacks.
dependencies = []

[project.optional-dependencies]
fastmcp = ["fastmcp"]
mcp = ["mcp"]
test = ["pytest>=8", "jsonschema>=4"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/sfox38/mesa-core"
Documentation = "https://github.com/sfox38/mesa-core/tree/main/documents"

[tool.hatch.build.targets.wheel]
packages = ["mesa_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]  # ternary preference: keep explicit if/else where clearer

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long one-line profile fixtures are clearer unwrapped

[tool.mypy]
python_version = "3.11"
strict = true
files = ["mesa_core"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
