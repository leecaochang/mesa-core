[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesa-core"
version = "1.3.0"
description = "Reference implementation of the MESA specification: a semantic safety and coordination layer for AI-operated smart environments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Steven Fox", email = "sfox38@gmail.com" }]
keywords = [
    "home-assistant",
    "home-automation",
    "smart-home",
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "ai-safety",
    "guardrails",
    "authorization",
    "access-control",
    "llm",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Typing :: Typed",
]
# Zero runtime dependencies by design: all HA data arrives via host callbacks.
dependencies = []

[project.optional-dependencies]
# fastmcp 2.12 is the chosen supported floor, not the oldest release that
# happens to work: some earlier 2.11.x patches also pass, but support is
# declared per minor. 2.12 and 2.14 pass the adapter tests (verified on 3.13
# and 3.14, RuntimeWarning promoted to error), as does 3.x; releases below the
# floor fail to import or to construct a server on the supported Pythons. The
# upper bound holds the line at the next major. The MCP SDK v2 rewrite moves
# the import paths both adapters use, so that extra stays on v1.
fastmcp = ["fastmcp>=2.12,<4"]
mcp = ["mcp>=1.27,<2"]
test = ["pytest>=8", "jsonschema>=4", "pyyaml>=6"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "jsonschema>=4", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/sfox38/mesa-core"
Documentation = "https://github.com/sfox38/mesa-core/tree/main/documents"

[tool.hatch.build.targets.wheel]
packages = ["mesa_core"]

[tool.hatch.build.targets.sdist]
# Allowlist, not a blacklist: only these paths can ever ship, regardless of
# what untracked local files (editor state, notes, caches) exist on disk.
only-include = [
    "mesa_core",
    "tests",
    "documents/MESA-Overview.md",
    "documents/MESA-Specification.md",
    "documents/MESA-Enrichment.md",
    "documents/MESA-Getting-Started.md",
    "documents/MESA-Module.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
# hatchling force-includes .gitignore into the sdist and ignores `exclude`
# entirely alongside `only-include`: excluding CHANGELOG.md here was verified to
# ship it anyway. The allowlist above is therefore the only thing keeping local
# files out of a build. Shipping .gitignore is harmless; do not add an `exclude`
# expecting it to work, and do not relax only-include into a blacklist.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]  # ternary preference: keep explicit if/else where clearer

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long one-line profile fixtures are clearer unwrapped

[tool.mypy]
python_version = "3.12"
strict = true
files = ["mesa_core"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
